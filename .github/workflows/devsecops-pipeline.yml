name: Pipeline DevSecOps & Quality Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    name: Análisis SAST, SCA y Evaluación Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: devsecops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias y Herramientas DevSecOps
        run: |
          python -m pip install --upgrade pip
          pip install -r 2_backend_orquestador/requirements.txt

      - name: Ejecutar Pipeline DevSecOps (SAST, SCA, DAST)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: devsecops_db
          DB_USER: postgres
          DB_PASSWORD: password123
          COMMIT_HASH: ${{ github.sha }}
        run: |
          cd 2_backend_orquestador
          python orquestador.py

      - name: Subir Artefactos de Auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-audit-reports
          path: |
            2_backend_orquestador/*.txt
            2_backend_orquestador/app_prueba/
          retention-days: 7