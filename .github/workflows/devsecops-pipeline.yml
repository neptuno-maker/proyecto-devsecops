name: DevSecOps Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-analysis:
    name: Escaneo de Seguridad y Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: devsecops_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inicializar esquema en base de datos
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=password123 psql -h localhost -U postgres -d devsecops_db -f 1_infraestructura/init_db.sql

      - name: Instalar dependencias del orquestador
        run: |
          python -m pip install --upgrade pip
          pip install -r 2_backend_orquestador/requirements.txt
          pip install bandit pip-audit requests psycopg

      - name: Iniciar servicio web para pruebas dinámicas (DAST Target)
        run: |
          python 2_backend_orquestador/api.py &
          timeout 30 bash -c 'until echo > /dev/tcp/127.0.0.1/5000; do sleep 1; done'
          echo "Servicio activo en http://127.0.0.1:5000"

      - name: Ejecutar análisis dinámico (DAST) con OWASP ZAP
        run: |
          mkdir -p zap_report
          chmod 777 zap_report
          docker run --rm --network="host" -v $(pwd)/zap_report:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:5000 -J dast_report.json -I || true
          cp zap_report/dast_report.json ./dast_report.json || true
          cp zap_report/dast_report.json 2_backend_orquestador/dast_report.json || true

      - name: Ejecutar Orquestador y Evaluar Quality Gate
        run: |
          cd 2_backend_orquestador
          python orquestador.py