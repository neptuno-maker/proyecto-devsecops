name: DevSecOps Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-analysis:
    name: Escaneo de Seguridad y Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: devsecops_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inicializar esquema en base de datos
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=password123 psql -h localhost -U postgres -d devsecops_db -f 1_infraestructura/init.sql

      - name: Instalar dependencias del orquestador
        run: |
          python -m pip install --upgrade pip
          pip install -r 2_backend_orquestador/requirements.txt
          pip install bandit

      - name: Ejecutar análisis estático (SAST) con Bandit
        run: |
          bandit -r 2_backend_orquestador/ -f json -o sast_report.json || true

      - name: Ejecutar Orquestador y Evaluar Quality Gate
        run: |
          python 2_backend_orquestador/orquestador.py